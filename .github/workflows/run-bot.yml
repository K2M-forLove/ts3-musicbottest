name: TS3 MusicBot

on:
  workflow_dispatch:

jobs:
  musicbot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Force Gradle to use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          chmod +x gradlew
          echo "GRADLE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

          ./gradlew --version \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            xdotool \
            mesa-utils \
            libgtk-3-0 \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libegl1 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxrender1 \
            libxtst6 \
            libxi6 \
            libasound2 \
            libnss3 \
            libgbm1 \
            ffmpeg \
            python3 \
            python3-pip \
            wget \
            curl

      - name: Install yt-dlp
        run: |
          python3 -m pip install --user --upgrade yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install TeamSpeak 3 Client
        run: |
          wget -O teamspeak.run \
            https://files.teamspeak-services.com/releases/client/3.6.2/TeamSpeak3-Client-linux_amd64-3.6.2.run

          chmod +x teamspeak.run

          ./teamspeak.run --accept

          echo "$PWD/TeamSpeak3-Client-linux_amd64" >> "$GITHUB_PATH"

      - name: Check TeamSpeak installation
        run: |
          echo "TeamSpeak files:"
          find "$PWD/TeamSpeak3-Client-linux_amd64" \
            -maxdepth 2 -type f 2>/dev/null | head -50 || true

          echo "TeamSpeak executable:"
          find "$PWD/TeamSpeak3-Client-linux_amd64" -type f \
            \( -name "ts3client_linux_amd64" -o -name "ts3client_runscript.sh" \) \
            -print 2>/dev/null || true

      - name: Build TS3 MusicBot
        run: |
          ./gradlew clean assemble \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Check built files
        run: |
          echo "Built JAR files:"
          find app/build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

      - name: Start virtual display
        env:
          DISPLAY: :99
        run: |
          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            +extension RANDR \
            &

          echo $! > /tmp/xvfb.pid
          sleep 5

          echo "DISPLAY=$DISPLAY"
          xdpyinfo -display :99 | head -30

      - name: Start TeamSpeak Client and accept client license
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          TS_DIR="$PWD/TeamSpeak3-Client-linux_amd64"

          if [ ! -f "$TS_DIR/ts3client_runscript.sh" ]; then
            echo "ERROR: TeamSpeak run script was not found."
            exit 1
          fi

          chmod +x "$TS_DIR/ts3client_runscript.sh"

          echo "Starting TeamSpeak Client..."
          cd "$TS_DIR"

          ./ts3client_runscript.sh --no-sandbox > /tmp/teamspeak.log 2>&1 &
          TS_PID=$!

          echo "$TS_PID" > /tmp/teamspeak.pid

          cd "$GITHUB_WORKSPACE"

          echo "Waiting for TeamSpeak license window..."

          ACCEPTED=0

          for i in $(seq 1 60); do
            WINDOW_IDS=$(xdotool search --onlyvisible --name ".*TeamSpeak.*" 2>/dev/null || true)

            if [ -n "$WINDOW_IDS" ]; then
              echo "TeamSpeak window detected."

              for WINDOW_ID in $WINDOW_IDS; do
                xdotool windowactivate --sync "$WINDOW_ID" 2>/dev/null || true

                # Move the license viewer to the end, then select "I accept".
                xdotool key --window "$WINDOW_ID" End 2>/dev/null || true
                sleep 1
                xdotool key --window "$WINDOW_ID" Tab 2>/dev/null || true
                sleep 1
                xdotool key --window "$WINDOW_ID" Return 2>/dev/null || true
              done

              sleep 5

              if grep -qi "accept" /tmp/teamspeak.log 2>/dev/null; then
                echo "TeamSpeak reported license-related output."
              fi

              ACCEPTED=1
              break
            fi

            sleep 2
          done

          echo "TeamSpeak startup log:"
          cat /tmp/teamspeak.log || true

          if [ "$ACCEPTED" -ne 1 ]; then
            echo "WARNING: TeamSpeak license window was not detected."
            echo "The MusicBot may still start if the client license was already accepted."
          fi

          sleep 5

      - name: Check TeamSpeak process
        env:
          DISPLAY: :99
        run: |
          echo "TeamSpeak processes:"
          ps aux | grep -i teamspeak | grep -v grep || true

          echo "TeamSpeak log:"
          cat /tmp/teamspeak.log 2>/dev/null || true

      - name: Check OpenGL
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          glxinfo -B 2>/dev/null || true

      - name: Create MusicBot config
        env:
          TS_SERVER: ${{ secrets.TS_SERVER }}
          TS_PORT: ${{ secrets.TS_PORT }}
          TS_PASSWORD: ${{ secrets.TS_PASSWORD }}
          TS_CHANNEL: ${{ secrets.TS_CHANNEL }}
          TS_CHANNEL_PASSWORD: ${{ secrets.TS_CHANNEL_PASSWORD }}
          TS_NICKNAME: ${{ secrets.TS_NICKNAME }}
        run: |
          cat > ts3-musicbot.config <<EOF
          SERVER_ADDRESS=$TS_SERVER
          SERVER_PASSWORD=$TS_PASSWORD
          SERVER_PORT=$TS_PORT
          CHANNEL_NAME=$TS_CHANNEL
          CHANNEL_PASSWORD=$TS_CHANNEL_PASSWORD
          NICKNAME=$TS_NICKNAME
          MARKET=US
          SPOTIFY_PLAYER=spotify
          USE_OFFICIAL_TSCLIENT=true
          EOF

          echo "MusicBot config created."

      - name: Start MusicBot
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
          GDK_BACKEND: x11
          GTK_USE_PORTAL: "0"
          JAVA_TOOL_OPTIONS: "-Dprism.order=sw -Dprism.verbose=true"
        run: |
          echo "Starting TS3 MusicBot..."

          ./gradlew run \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --args="--config ts3-musicbot.config --accept-ts-license"
