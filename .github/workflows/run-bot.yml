name: TS3 MusicBot

on:
  workflow_dispatch:

jobs:
  musicbot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjfx \
            xvfb \
            ffmpeg \
            python3 \
            python3-pip \
            wget \
            curl

      - name: Check Java and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          chmod +x gradlew
          ./gradlew --version

      - name: Install yt-dlp
        run: |
          python3 -m pip install --user --upgrade yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install TeamSpeak 3 Client
        run: |
          wget -O teamspeak.run \
            https://files.teamspeak-services.com/releases/client/3.6.2/TeamSpeak3-Client-linux_amd64-3.6.2.run
          chmod +x teamspeak.run
          ./teamspeak.run --accept-license
          echo "$PWD/TeamSpeak3-Client-linux_amd64" >> "$GITHUB_PATH"

      - name: Build TS3 MusicBot
        run: |
          ./gradlew clean assemble --no-daemon

      - name: Check built files
        run: |
          echo "Built JAR files:"
          find app/build/libs -maxdepth 1 -type f -name "*.jar" -print

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3

      - name: Create MusicBot config
        env:
          TS_SERVER: ${{ secrets.TS_SERVER }}
          TS_PORT: ${{ secrets.TS_PORT }}
          TS_PASSWORD: ${{ secrets.TS_PASSWORD }}
          TS_CHANNEL: ${{ secrets.TS_CHANNEL }}
          TS_CHANNEL_PASSWORD: ${{ secrets.TS_CHANNEL_PASSWORD }}
          TS_NICKNAME: ${{ secrets.TS_NICKNAME }}
        run: |
          cat > ts3-musicbot.config <<EOF
          SERVER_ADDRESS=$TS_SERVER
          SERVER_PASSWORD=$TS_PASSWORD
          SERVER_PORT=$TS_PORT
          CHANNEL_NAME=$TS_CHANNEL
          CHANNEL_PASSWORD=$TS_CHANNEL_PASSWORD
          NICKNAME=$TS_NICKNAME
          MARKET=US
          SPOTIFY_PLAYER=spotify
          USE_OFFICIAL_TSCLIENT=true
          EOF

      - name: Start MusicBot
        env:
          DISPLAY: :99
        run: |
          JAR=$(find app/build/libs -maxdepth 1 -type f -name "*.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: MusicBot JAR was not found."
            exit 1
          fi

          echo "Starting: $JAR"

          java \
            --module-path /usr/share/openjfx/lib \
            --add-modules javafx.controls \
            -server \
            -jar "$JAR" \
            --config ts3-musicbot.config \
            --accept-ts-license
