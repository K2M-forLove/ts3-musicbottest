name: TS3 MusicBot

on:
  workflow_dispatch:

jobs:
  musicbot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-11-jdk \
            openjfx \
            xvfb \
            libxslt1.1 \
            libnss3 \
            libasound2 \
            libglib2.0-0 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxrender1 \
            libxtst6 \
            libxi6 \
            libdbus-1-3 \
            ffmpeg \
            python3 \
            python3-pip \
            wget \
            curl

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v yt-dlp)" "$HOME/.local/bin/youtube-dl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build TS3 MusicBot
        run: |
          chmod +x gradlew
          ./gradlew assemble

      - name: Create bot config
        env:
          TS_SERVER: ${{ secrets.TS_SERVER }}
          TS_PORT: ${{ secrets.TS_PORT }}
          TS_PASSWORD: ${{ secrets.TS_PASSWORD }}
          TS_CHANNEL: ${{ secrets.TS_CHANNEL }}
          TS_CHANNEL_PASSWORD: ${{ secrets.TS_CHANNEL_PASSWORD }}
          TS_NICKNAME: ${{ secrets.TS_NICKNAME }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          cat > ts3-musicbot.config <<EOF
          SERVER_ADDRESS=$TS_SERVER
          SERVER_PASSWORD=$TS_PASSWORD
          SERVER_PORT=$TS_PORT
          CHANNEL_NAME=$TS_CHANNEL
          CHANNEL_PASSWORD=$TS_CHANNEL_PASSWORD
          CHANNEL_FILE_PATH=
          NICKNAME=$TS_NICKNAME
          MARKET=US
          SPOTIFY_PLAYER=spotify
          USE_OFFICIAL_TSCLIENT=true
          EOF

      - name: Start MusicBot
        env:
          DISPLAY: :99
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3

          java \
            --module-path /usr/share/openjfx/lib \
            --add-modules javafx.controls \
            -server \
            -jar app/build/libs/ts3-musicbot.jar \
            --config ts3-musicbot.config \
            --accept-ts-license
