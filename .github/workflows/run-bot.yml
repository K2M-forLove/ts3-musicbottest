name: TS3 MusicBot

on:
  workflow_dispatch:

jobs:
  musicbot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            mesa-utils \
            libgtk-3-0 \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libegl1 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxrender1 \
            libxtst6 \
            libxi6 \
            libasound2 \
            libnss3 \
            libgbm1 \
            ffmpeg \
            python3 \
            python3-pip \
            wget \
            curl

      - name: Check Java and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          chmod +x gradlew
          ./gradlew --version

      - name: Install yt-dlp
        run: |
          python3 -m pip install --user --upgrade yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install TeamSpeak 3 Client
        run: |
          wget -O teamspeak.run \
            https://files.teamspeak-services.com/releases/client/3.6.2/TeamSpeak3-Client-linux_amd64-3.6.2.run

          chmod +x teamspeak.run

          ./teamspeak.run --accept

          echo "$PWD/TeamSpeak3-Client-linux_amd64" >> "$GITHUB_PATH"

      - name: Check TeamSpeak installation
        run: |
          echo "TeamSpeak installation:"
          find "$PWD/TeamSpeak3-Client-linux_amd64" -maxdepth 2 -type f 2>/dev/null | head -50 || true

          echo "TeamSpeak executable:"
          find "$PWD/TeamSpeak3-Client-linux_amd64" -type f \
            \( -name "ts3client_linux_amd64" -o -name "teamspeak3" \) \
            -print 2>/dev/null || true

      - name: Build TS3 MusicBot
        run: |
          ./gradlew clean assemble --no-daemon --stacktrace

      - name: Check built files
        run: |
          echo "Built JAR files:"
          find app/build/libs -maxdepth 1 -type f -name "*.jar" -print

      - name: Start virtual display
        env:
          DISPLAY: :99
        run: |
          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            +extension RANDR \
            &

          echo $! > /tmp/xvfb.pid

          sleep 5

          echo "DISPLAY=$DISPLAY"
          xdpyinfo -display :99 | head -30

      - name: Check OpenGL
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          glxinfo -B 2>/dev/null || true

      - name: Create MusicBot config
        env:
          TS_SERVER: ${{ secrets.TS_SERVER }}
          TS_PORT: ${{ secrets.TS_PORT }}
          TS_PASSWORD: ${{ secrets.TS_PASSWORD }}
          TS_CHANNEL: ${{ secrets.TS_CHANNEL }}
          TS_CHANNEL_PASSWORD: ${{ secrets.TS_CHANNEL_PASSWORD }}
          TS_NICKNAME: ${{ secrets.TS_NICKNAME }}
        run: |
          cat > ts3-musicbot.config <<EOF
          SERVER_ADDRESS=$TS_SERVER
          SERVER_PASSWORD=$TS_PASSWORD
          SERVER_PORT=$TS_PORT
          CHANNEL_NAME=$TS_CHANNEL
          CHANNEL_PASSWORD=$TS_CHANNEL_PASSWORD
          NICKNAME=$TS_NICKNAME
          MARKET=US
          SPOTIFY_PLAYER=spotify
          USE_OFFICIAL_TSCLIENT=true
          EOF

          echo "MusicBot config created."

      - name: Start MusicBot
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
          GDK_BACKEND: x11
          GTK_USE_PORTAL: "0"
          JAVA_TOOL_OPTIONS: "-Dprism.order=sw -Dprism.verbose=true"
        run: |
          echo "Starting TS3 MusicBot with Gradle..."

          ./gradlew run \
            --no-daemon \
            --stacktrace \
            --info \
            --args="--config ts3-musicbot.config --accept-ts-license"
